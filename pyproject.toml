[project]
name = "pipefy-mcp-enterprise"
version = "0.1.0"
description = "Pipefy Model Context Protocol (MCP) Server for Gemini Enterprise and Antigravity"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pipefy-mcp-server>=0.5.0b0",
    "mcp[cli]>=2.0.0",
    "httpx>=0.27.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
